# A production-like stack on one machine: Postgres, the relay and accounts API, and the client as
# static files behind Caddy.
#
#   docker compose up --build               web on http://localhost:8080
#   docker compose --profile replay up      also replays a saved race through ingest -> relay
#   docker compose --profile ingest up      also runs a real ingest (needs a non-cloud network)
#
# Every value below has a development default; override any of them in a `.env` file next to this
# one (see .env.example). None of the defaults is a secret. docs/deploy.md has the walkthrough.

name: pitwall

x-server: &server
  image: pitwall-server
  build:
    context: .
    dockerfile: server/Dockerfile
  restart: unless-stopped
  stop_grace_period: 15s

x-relay-link: &relay-link
  RELAY_URL: http://relay:3000
  RELAY_SECRET: ${RELAY_SECRET:-pitwall-local-relay-secret}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitwall-local-only}
      POSTGRES_DB: pitwall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitwall -d pitwall']
      interval: 5s
      timeout: 3s
      retries: 10

  # The relay and the accounts API: sign-in, synced dashboards, payments webhooks, and the WebSocket
  # that fans live races out to viewers. It runs the migrations when it starts.
  relay:
    <<: *server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *relay-link
      MODE: relay
      DATABASE_URL: postgres://pitwall:${POSTGRES_PASSWORD:-pitwall-local-only}@postgres:5432/pitwall
      # Where people open the app. A localhost address keeps the development stand-ins on: sign-in
      # links go to the log and to /api/dev/mailbox, and checkout is the fake provider.
      APP_URL: http://localhost:${WEB_PORT:-8080}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      NODE_ENV: ${NODE_ENV:-}
      SMTP_URL: ${SMTP_URL:-}
      # Requests reach the relay from the Docker network, not from loopback; the ports are published
      # on 127.0.0.1 only, so the mailbox still serves this machine alone.
      DEV_MAILBOX_ANY_IP: 'true'
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
    ports:
      - 127.0.0.1:${RELAY_PORT:-3300}:3000
    volumes:
      - ${DATA_DIR:-./client/e2e/real/data}:/data:ro

  # The client build and its proxy: / is the app, /data the saved sessions, /api and /live the relay.
  web:
    image: pitwall-web
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_DATA_SOURCE: api
        VITE_API_URL: /data
        VITE_WS_URL: ws://localhost:${WEB_PORT:-8080}/live
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_UPSTREAM: relay:3000
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:8080
    volumes:
      - ${DATA_DIR:-./client/e2e/real/data}/out:/srv/data:ro

  # Reads the live feed and pushes it to the relay. It needs a network F1's feed does not block, so
  # it is off unless asked for: `docker compose --profile ingest up`. It records to INGEST_DATA_DIR.
  ingest:
    <<: *server
    profiles: [ingest]
    depends_on:
      relay:
        condition: service_healthy
    environment:
      <<: *relay-link
      MODE: ingest
      F1TV_TOKEN: ${F1TV_TOKEN:-}
    volumes:
      - ${INGEST_DATA_DIR:-./data}:/data

  # The same path with a saved race as the feed: replay-live plays a trimmed 2025 Las Vegas race
  # (committed in the repository) through an ingest process to the relay, so the live screens work
  # offline. REPLAY_SPEED 100 starts the race about 35 s in.
  replay-live:
    <<: *server
    profiles: [replay]
    restart: 'no'
    depends_on:
      relay:
        condition: service_healthy
    command:
      [
        'node',
        'server/dist/cli/replay-live.js',
        '--dir',
        '/replay',
        '--speed',
        '${REPLAY_SPEED:-100}'
      ]
    environment:
      <<: *relay-link
      MODE: ingest
      DATA_DIR: /tmp/replay
    volumes:
      - ./server/src/sources/f1/fixtures/2025-las-vegas-race:/replay:ro

volumes:
  pgdata:
