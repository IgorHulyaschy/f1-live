# The relay and accounts API on Fly.io. Run from the repository root:
#   fly launch --no-deploy --copy-config --config deploy/fly/fly.toml --dockerfile server/Dockerfile
#   fly secrets set --config deploy/fly/fly.toml RELAY_SECRET=... DATABASE_URL=... (docs/deploy.md)
#   fly deploy --ha=false --config deploy/fly/fly.toml --dockerfile server/Dockerfile
# The relay keeps the live session in memory, so it runs as exactly one machine.

app = "pitwall-relay"           # the owner's name for it; it is a global name on fly.io
primary_region = "ams"          # the region closest to most viewers
kill_signal = "SIGTERM"
kill_timeout = 10

[env]
  MODE = "relay"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  # Public values; replace example.com with the real domain.
  APP_URL = "https://app.example.com"
  CORS_ORIGINS = "https://app.example.com"
  ACCOUNTS_PUBLIC_URL = "https://api.example.com"
  COOKIE_DOMAIN = "example.com"
  BRAND_NAME = "Pitwall"
  MAIL_FROM = "Pitwall <sign-in@example.com>"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
