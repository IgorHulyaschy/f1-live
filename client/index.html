<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<title>%SITE_TITLE%</title>
		<meta name="description" content="%SITE_DESCRIPTION%" />
		<meta name="robots" content="%SITE_ROBOTS%" />
		<meta name="theme-color" content="%THEME_COLOUR%" />
		<script>
			// The shell paints before the app's scripts load: apply a saved light theme first, or a
			// light-theme viewer sees the dark default flash (src/hooks/use-theme.ts keeps it after).
			try {
				if (localStorage.getItem('pitwall-theme') === 'light') {
					document.documentElement.classList.remove('dark');
					document.querySelector('meta[name="theme-color"]').content = '%THEME_COLOUR_LIGHT%';
				}
			} catch {}
		</script>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="%SITE_NAME%" />
		<meta property="og:title" content="%SITE_TITLE%" />
		<meta property="og:description" content="%SITE_DESCRIPTION%" />
		<meta property="og:image" content="%SITE_IMAGE%" />
		<meta property="og:image:width" content="%SITE_IMAGE_WIDTH%" />
		<meta property="og:image:height" content="%SITE_IMAGE_HEIGHT%" />
		<meta property="og:image:alt" content="%SITE_TITLE%" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="%SITE_TITLE%" />
		<meta name="twitter:description" content="%SITE_DESCRIPTION%" />
		<meta name="twitter:image" content="%SITE_IMAGE%" />
	</head>
	<body>
		<div id="root">
			<!-- Painted before any script or web font loads: the wordmark's two bars, drawn. -->
			<div class="min-h-svh" role="status" aria-busy="true" aria-label="Loading">
				<header class="bg-background/90 sticky top-0 z-40 mb-4 border-b backdrop-blur-sm">
					<div class="flex h-12 items-center px-3 sm:px-4 md:px-6">
						<svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true">
							<polygon class="fill-foreground" points="6,0 12,0 6,16 0,16" />
							<polygon class="fill-focus" points="20,0 26,0 20,16 14,16" />
						</svg>
					</div>
				</header>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
